#:schema https://json.schemastore.org/any.json

# Air configuration for Golang live-reload
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ."
  bin = "tmp/main.exe"
  full_bin = "tmp/main.exe"
  entrypoint = ["tmp/main.exe"]
  args_bin = []
  
  # Directory and file filtering
  include_dir = []
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  
  # Build process behavior
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = "500ms"
  rerun = false
  rerun_delay = 500
  
  # Polling options (set poll = true if file watching issues occur)
  poll = false
  poll_interval = 0

  pre_cmd = []
  post_cmd = []

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = true
  keep_scroll = true
